<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="402" viewBox="0 0 1200 402" role="img" aria-labelledby="title desc">
<title id="title">Từ tài liệu đến kho tri thức</title><desc id="desc">Đọc tài liệu, chuẩn hóa, chia chunk, tạo vector, lưu dữ liệu; sau đó truy xuất kiểm tra với metadata và nguồn.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#97a8c4"/></marker></defs>
