<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="548" viewBox="0 0 1200 548" role="img" aria-labelledby="title desc">
<title id="title">So sánh ba chiến lược bằng cùng benchmark</title><desc id="desc">Cùng dữ liệu và mô hình tạo ba chiến lược, so sánh bằng 15 câu dev; sau khi cố định, đánh giá với 5 câu test và chấm năm khía cạnh.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9aabc6"/></marker></defs>
<rect width="1200" height="548" rx="24" fill="#f5f8ff"/>
<g font-family="Arial, sans-serif"><text x="40" y="50" font-size="25" font-weight="700" fill="#162b52">MỘT CORPUS · BA CHIẾN LƯỢC · MỘT BENCHMARK</text><text x="40" y="78" font-size="15" fill="#5a6d8d">Ví dụ: thay chunking, sau đó kiểm tra riêng tác động của metadata filter</text>
<rect x="40" y="110" width="210" height="209" rx="16" fill="#fff" stroke="#d6e1f3"/><text x="60" y="145" font-size="17" font-weight="700" fill="#162b52">Đầu vào chung</text><text x="60" y="177" font-size="14" fill="#526987">≥ 30 trang tài liệu</text><text x="60" y="204" font-size="14" fill="#526987">Cùng model vector</text><text x="60" y="231" font-size="14" fill="#526987">Cùng câu hỏi &amp; gold</text><text x="60" y="269" font-size="13" fill="#526987">Giữ các yếu tố khác</text><text x="60" y="290" font-size="13" fill="#526987">cố định để so sánh.</text>
<g transform="translate(295 110)"><rect width="310" height="58" rx="12" fill="#fff" stroke="#d6e1f3"/><text x="18" y="24" font-size="15" font-weight="700" fill="#335dd4">A · Fixed-size</text><text x="18" y="44" font-size="13" fill="#526987">Chia theo kích thước</text></g>
<g transform="translate(295 185)"><rect width="310" height="58" rx="12" fill="#fff" stroke="#d6e1f3"/><text x="18" y="24" font-size="15" font-weight="700" fill="#335dd4">B · Theo section / đoạn</text><text x="18" y="44" font-size="13" fill="#526987">Thay cách chia chunk</text></g>
<g transform="translate(295 260)"><rect width="310" height="58" rx="12" fill="#e8f6f2" stroke="#a5ddcf"/><text x="18" y="24" font-size="15" font-weight="700" fill="#16745e">C · Section + filter</text><text x="18" y="44" font-size="13" fill="#386c60">Giống B; thêm lọc metadata</text></g>
<rect x="650" y="110" width="510" height="209" rx="16" fill="#fff" stroke="#d6e1f3"/><text x="670" y="145" font-size="17" font-weight="700" fill="#162b52">Cùng benchmark: ít nhất 20 câu</text><rect x="670" y="164" width="210" height="54" rx="10" fill="#e8efff"/><text x="686" y="187" font-size="15" font-weight="700" fill="#335dd4">15 câu dev</text><text x="686" y="206" font-size="12" fill="#526987">Thử và chọn cấu hình</text><rect x="895" y="164" width="245" height="54" rx="10" fill="#e8f6f2"/><text x="911" y="187" font-size="15" font-weight="700" fill="#16745e">5 câu test</text><text x="911" y="206" font-size="12" fill="#386c60">Đánh giá sau khi cố định</text><text x="670" y="254" font-size="14" fill="#526987">Mỗi câu có trang nguồn và đoạn evidence.</text><text x="670" y="280" font-size="14" fill="#526987">Lưu top-3, điểm, nguồn và kết quả từng câu.</text>
<rect x="40" y="356" width="1120" height="148" rx="16" fill="#e9eefb"/><text x="60" y="388" font-size="16" font-weight="700" fill="#284373">ĐÁNH GIÁ &amp; GIẢI THÍCH</text><text x="60" y="419" font-size="14" fill="#415b83">① Retrieval accuracy    ② Chunk coherence    ③ Metadata usefulness</text><text x="60" y="447" font-size="14" fill="#415b83">④ Grounding quality    ⑤ Data strategy impact</text><text x="60" y="478" font-size="13" fill="#526987">So sánh kết quả, nêu ví dụ sai và đánh đổi; ghi nhãn thủ công khi cần.</text>
</g><g fill="none" stroke="#9aabc6" stroke-width="2" marker-end="url(#arrow)"><path d="M254 214 H288"/><path d="M610 214 H643"/></g>
</svg>
